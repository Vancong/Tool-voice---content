[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie_review_tool"
version = "0.1.0"
description = "Desktop AI movie review tool"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "opencv-python==4.9.0.80",
    "ffmpeg-python==0.2.0",
    "loguru==0.7.2",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.2",
    "anyio==4.3.0"
]
